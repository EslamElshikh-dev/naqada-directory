name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify published data and contracts
        run: npm test

      - name: Audit local media references
        run: npm run audit:media

      - name: Audit CSS architecture
        run: npm run audit:css

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Verify server-rendered technical SEO output
        run: |
          npm run start > /tmp/naqada-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          node <<'NODE'
          const localOrigin = 'http://127.0.0.1:3000';
          const productionOrigin = 'https://naqada-directory.vercel.app';
          const verificationToken = 'a5AfDDI67VsUYxqSvx00gPy5bqSb1V9YoZ1DX8-GkxY';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchReady(path) {
            let lastError;
            for (let attempt = 0; attempt < 30; attempt += 1) {
              try {
                const response = await fetch(`${localOrigin}${path}`, { redirect: 'follow' });
                if (response.ok) return response;
                lastError = new Error(`${path} returned ${response.status}`);
              } catch (error) {
                lastError = error;
              }
              await sleep(500);
            }
            throw lastError || new Error(`Unable to fetch ${path}`);
          }

          const [homeResponse, robotsResponse, sitemapResponse] = await Promise.all([
            fetchReady('/'),
            fetchReady('/robots.txt'),
            fetchReady('/sitemap.xml'),
          ]);

          const home = await homeResponse.text();
          const robots = await robotsResponse.text();
          const sitemap = await sitemapResponse.text();

          if (!home.includes('name="google-site-verification"') || !home.includes(`content="${verificationToken}"`)) {
            throw new Error('Google Search Console verification meta is missing from the homepage head');
          }
          if (!home.includes('rel="canonical"') || !home.includes(`href="${productionOrigin}/"`)) {
            throw new Error('Homepage canonical does not point to the adopted production Vercel URL');
          }
          if (!robots.includes(`Sitemap: ${productionOrigin}/sitemap.xml`)) {
            throw new Error('robots.txt does not advertise the production sitemap');
          }
          if (/^Host:/mi.test(robots)) {
            throw new Error('robots.txt contains an unnecessary Host directive');
          }
          if (/<priority>|<changefreq>/i.test(sitemap)) {
            throw new Error('Sitemap contains priority/changefreq fields that Google ignores');
          }

          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1]);
          if (urls.length < 250) {
            throw new Error(`Sitemap unexpectedly contains only ${urls.length} URLs`);
          }
          const invalidHost = urls.find((url) => !url.startsWith(`${productionOrigin}/`));
          if (invalidHost) {
            throw new Error(`Sitemap contains a non-production URL: ${invalidHost}`);
          }
          const missingTrailingSlash = urls.find((url) => !url.endsWith('/'));
          if (missingTrailingSlash) {
            throw new Error(`Sitemap URL does not match trailing-slash canonical format: ${missingTrailingSlash}`);
          }
          NODE

      - name: Smoke-test production intake endpoint without writes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node <<'NODE'
          const url = 'https://ceyjfguoomdlrtsujskj.supabase.co/functions/v1/directory-intake';
          const origin = 'https://naqada-directory.vercel.app';

          const preflight = await fetch(url, {
            method: 'OPTIONS',
            headers: { Origin: origin },
          });
          if (preflight.status !== 204) {
            throw new Error(`Intake preflight failed with ${preflight.status}`);
          }
          if (preflight.headers.get('access-control-allow-origin') !== origin) {
            throw new Error('Intake preflight returned an unexpected CORS origin');
          }

          const response = await fetch(url, {
            method: 'POST',
            headers: {
              Origin: origin,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ website: 'ci-smoke-no-write' }),
          });
          const body = await response.json();
          if (!response.ok || body.ok !== true) {
            throw new Error(`Intake no-write smoke failed with ${response.status}`);
          }
          NODE
