name: Visual QA V2

on:
  pull_request:
  push:
    branches:
      - chore/project-hygiene-v2
  workflow_dispatch:

concurrency:
  group: visual-qa-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  visual-qa:
    # Playwright 1.55 supports Ubuntu 24.04; ubuntu-latest can move beyond it.
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        id: build
        run: |
          node scripts/prepare-article-editor-fixture.mjs
          npm run build

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 lighthouse@12.8.2
          npx playwright install chromium

      - name: Start production server
        id: server
        run: |
          NAQADA_QA_READ_ONLY=1 NODE_OPTIONS='--import=./.github/qa-readonly-fetch.mjs' npm run start > /tmp/naqada-next.log 2>&1 &
          echo $! > /tmp/naqada-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/naqada-next.log
          exit 1

      - name: Verify responsive hero formats, preload and legacy fallback
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node .github/home-hero-qa.mjs

      - name: Verify Arabic typography and responsive reading tokens
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          node scripts/typography-audit.mjs > artifacts/typography.jsonl

      - name: Verify complete article editor on desktop and mobile
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node .github/article-editor-qa.mjs

      - name: Verify search behavior and event measurement
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node .github/search-quality-qa.mjs

      - name: Verify ticker startup, direction and reading speed
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node .github/ticker-motion-qa.mjs

      - name: Verify first-visit usability and consistent public counts
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node .github/usability-qa.mjs

      - name: Verify complete public journeys and content consistency
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          QA_BASE_URL: http://127.0.0.1:3000
        run: node .github/production-acceptance.mjs

      - name: Verify keyboard accessibility and sharing cards
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node .github/reading-quality-qa.mjs

      - name: Verify withdrawal during an older in-flight read without database writes
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node .github/withdrawal-qa.mjs

      - name: Verify withdrawal while an older public read is in flight
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node .github/content-withdrawal-qa.mjs

      - name: Run responsive diagnostics and screenshots
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node .github/visual-qa-v2.mjs

      - name: Enforce measured CSS transfer budget and valid LCP
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node .github/performance-budget.mjs

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-v2
          path: artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-v2-server-log
          path: /tmp/naqada-next.log
          if-no-files-found: ignore
          retention-days: 7
