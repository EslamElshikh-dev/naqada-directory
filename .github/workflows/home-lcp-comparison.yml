name: Home LCP comparison

on:
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/home.module.css'
      - 'components/home-hero-image.tsx'
      - 'lib/home-hero-media.json'
      - 'public/images/home-hero/**'
      - '.github/home-lcp-qa.mjs'
      - '.github/workflows/home-lcp-comparison.yml'

permissions:
  contents: read

concurrency:
  group: home-lcp-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install candidate dependencies and pinned browser tools
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0 lighthouse@12.8.2
          npx playwright install chromium
      - name: Check out the exact PR base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build
      - name: Measure baseline with three cold-browser runs per template
        working-directory: baseline
        run: |
          NAQADA_QA_READ_ONLY=1 NODE_OPTIONS='--import=./.github/qa-readonly-fetch.mjs' npm start -- --hostname 127.0.0.1 > /tmp/lcp-baseline.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          LCP_QA_REPRESENTATIVE=1 LCP_QA_OUTPUT=../artifacts/home-lcp/before node ../candidate/.github/home-lcp-qa.mjs
      - name: Build candidate
        run: npm run build
      - name: Measure candidate with the same browser and throttling
        run: |
          NAQADA_QA_READ_ONLY=1 NODE_OPTIONS='--import=./.github/qa-readonly-fetch.mjs' npm start -- --hostname 127.0.0.1 > /tmp/lcp-candidate.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          LCP_QA_REPRESENTATIVE=1 LCP_QA_OUTPUT=../artifacts/home-lcp/after node .github/home-lcp-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-lcp-comparison
          path: |
            artifacts/home-lcp
            /tmp/lcp-baseline.log
            /tmp/lcp-candidate.log
          if-no-files-found: error
          retention-days: 14
