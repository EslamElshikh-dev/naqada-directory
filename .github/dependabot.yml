version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      next-runtime:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
        update-types:
          - patch
          - minor
      tooling:
        patterns:
          - eslint
          - typescript
          - "@types/*"
        update-types:
          - patch
          - minor
    labels:
      - dependencies
